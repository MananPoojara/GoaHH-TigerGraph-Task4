[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudlens"
version = "0.1.0"
description = "TigerGraph agentic fraud investigation system"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "sse-starlette>=2.1", "httpx>=0.27"]
graph = ["pyTigerGraph>=1.6"]
agent = ["langgraph>=0.2", "langchain-core>=0.3", "langchain-mcp-adapters>=0.1", "langchain-google-genai>=2.0", "google-genai>=1.0"]
mcp = ["mcp[cli]>=1.2", "tigergraph-mcp>=1.0.3"]
data = ["pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.5"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "black>=24.4"]

# The repository map uses hyphenated directory names for ownership clarity.
# Hyphens are not valid in Python module names, so each package directory is
# mapped explicitly to an importable module here.
[tool.setuptools.package-dir]
fraudlens_contracts = "packages/contracts/fraudlens_contracts"
fraudlens_prompts = "packages/prompts/fraudlens_prompts"
fraudlens_observability = "packages/observability/fraudlens_observability"
fraudlens_policy = "services/policy-engine/fraudlens_policy"
fraudlens_simulator = "services/evidence-simulator/fraudlens_simulator"
fraudlens_investigator = "services/investigator/fraudlens_investigator"
fraudlens_graph = "graph/client/fraudlens_graph"
fraudlens_loading = "graph/loading/fraudlens_loading"
app = "apps/api/app"

[tool.setuptools.packages.find]
where = ["packages/contracts", "packages/prompts", "packages/observability", "services/policy-engine", "services/evidence-simulator", "services/investigator", "graph/client", "graph/loading", "apps/api"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Depends() in an argument default is the documented FastAPI idiom, not the
# mutable-default bug B008 exists to catch.
"apps/api/app/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
